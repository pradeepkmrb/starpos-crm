services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: starpos_crm
      POSTGRES_PASSWORD: starpos_crm
      POSTGRES_DB: starpos_crm
    ports:
      - "5432:5432"
    volumes:
      - starpos_crm_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U starpos_crm"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: ../..
      dockerfile: infra/docker/api.Dockerfile
    environment:
      DATABASE_URL: postgresql://starpos_crm:starpos_crm@postgres:5432/starpos_crm?schema=public
      REDIS_URL: redis://redis:6379
    ports:
      - "4000:4000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ../../apps/api:/workspace/apps/api
      - ../../packages:/workspace/packages

  worker:
    build:
      context: ../..
      dockerfile: infra/docker/api.Dockerfile
    command: ["pnpm", "worker"]
    environment:
      DATABASE_URL: postgresql://starpos_crm:starpos_crm@postgres:5432/starpos_crm?schema=public
      REDIS_URL: redis://redis:6379
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ../../apps/api:/workspace/apps/api
      - ../../packages:/workspace/packages

  web:
    build:
      context: ../..
      dockerfile: infra/docker/web.Dockerfile
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:4000
    ports:
      - "3000:3000"
    depends_on:
      - api
    volumes:
      - ../../apps/web:/workspace/apps/web
      - ../../packages:/workspace/packages

volumes:
  starpos_crm_postgres_data:
