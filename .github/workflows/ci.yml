name: CI

on:
  push:
    # The default branch is master; there is no main. Naming the wrong branch
    # here meant pushes to the default branch ran no checks at all.
    branches: [master]
  # Every pull request, whatever its base — which is what covers the
  # claude/** feature branches without paying for a run on each push to them.
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.0

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile=false

      - name: Generate Prisma client
        run: pnpm db:generate
        env:
          DATABASE_URL: postgresql://digitel:digitel@localhost:5432/digitel?schema=public

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Build
        run: pnpm build

      - name: Test
        run: pnpm test
